<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FaceID Pro | Mobile 24/7</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            position: relative;
            overflow: hidden;
            touch-action: pan-y pinch-zoom;
        }
        /* Asosiy konteyner - mobil uchun to'liq ekran */
        
        .app-wrapper {
            width: 100%;
            height: 100vh;
            max-width: 100%;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            position: relative;
            border: none;
            overflow: hidden;
        }
        /* Status bar - mobil uchun */
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.5);
            color: #0ff;
            font-size: 12px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }
        
        .battery {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Kamera sektsiyasi - mobil uchun optimallashtirilgan */
        
        .camera-section {
            flex: 1;
            position: relative;
            background: #000;
            min-height: 0;
            overflow: hidden;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #cameraCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* Overlay elementlari */
        
        .detection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0ff, #f0f, transparent);
            animation: scanMove 2s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes scanMove {
            0% {
                top: -2px;
            }
            100% {
                top: 100%;
            }
        }
        /* Deteksiya ma'lumotlari */
        
        .detection-info {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .status-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #0ff;
            color: #0ff;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-badge.danger {
            border-color: #f0f;
            color: #f0f;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .counter-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #0ff;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Controls - mobil uchun pastki panel */
        
        .controls-panel {
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
        }
        
        .mobile-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.5);
            color: #0ff;
            border: 1px solid #0ff;
            transition: all 0.2s;
            cursor: pointer;
            min-width: 0;
        }
        
        .mobile-btn i {
            font-size: 20px;
        }
        
        .mobile-btn span {
            font-size: 11px;
        }
        
        .mobile-btn.active {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        
        .mobile-btn.danger {
            border-color: #f0f;
            color: #f0f;
        }
        
        .mobile-btn.danger.active {
            background: #f0f;
            color: #000;
            box-shadow: 0 0 20px #f0f;
        }
        
        .mobile-btn:active {
            transform: scale(0.95);
        }
        /* Stats panel - mobil uchun scroll */
        
        .stats-container {
            background: rgba(20, 20, 30, 0.95);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .stats-container.show {
            max-height: 300px;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 10px;
        }
        
        .stat-item {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        
        .stat-item i {
            color: #0ff;
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        
        .stat-label {
            color: #888;
            font-size: 9px;
            text-transform: uppercase;
        }
        /* Log panel - mobil uchun */
        
        .log-container {
            background: rgba(20, 20, 30, 0.95);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .log-container.show {
            max-height: 200px;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .log-panel {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            color: #0ff;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
        }
        /* Users panel - mobil uchun */
        
        .users-container {
            background: rgba(20, 20, 30, 0.95);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .users-container.show {
            max-height: 200px;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .users-panel {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        
        .user-card {
            background: rgba(0, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .user-card:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.95);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0ff, #f0f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 5px;
            color: #000;
            font-weight: bold;
            font-size: 18px;
        }
        
        .user-name {
            font-size: 11px;
            color: #0ff;
        }
        /* Modal - mobil uchun */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: rgba(20, 20, 30, 0.98);
            padding: 25px;
            border-radius: 25px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #0ff;
        }
        
        .modal input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #0ff;
            border-radius: 15px;
            color: #0ff;
            font-size: 16px;
            -webkit-appearance: none;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(0, 255, 255, 0.1);
            color: #0ff;
            border: 1px solid #0ff;
            cursor: pointer;
        }
        
        .modal-btn.danger {
            border-color: #f0f;
            color: #f0f;
        }
        /* Background service indicator */
        
        .bg-service {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #0ff;
            color: #000;
            text-align: center;
            padding: 5px;
            font-size: 12px;
            font-weight: bold;
            z-index: 9999;
            display: none;
        }
        
        .bg-service.show {
            display: block;
        }
        /* Touch zones */
        
        .touch-zone {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: transparent;
            z-index: 100;
        }
        /* Loading */
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #0ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="color: #0ff; font-size: 14px;">Tizim yuklanmoqda...</div>
    </div>

    <!-- Background service indicator -->
    <div class="bg-service" id="bgService">
        <i class="fas fa-eye"></i> Background kuzatuv faol
    </div>

    <!-- Asosiy app -->
    <div class="app-wrapper">
        <!-- Status bar -->
        <div class="status-bar">
            <div><i class="fas fa-shield-alt"></i> FaceID Pro</div>
            <div class="battery">
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
                <span id="timeNow">12:00</span>
            </div>
        </div>

        <!-- Kamera sektsiyasi -->
        <div class="camera-section">
            <div class="camera-container">
                <video id="cameraFeed" autoplay playsinline></video>
                <canvas id="cameraCanvas"></canvas>

                <!-- Detection overlay -->
                <div class="detection-overlay">
                    <div class="scan-line"></div>
                </div>

                <!-- Detection info -->
                <div class="detection-info">
                    <div class="status-badge" id="statusBadge">
                        <i class="fas fa-circle"></i>
                        <span id="statusText">Kutilyapti</span>
                    </div>
                    <div class="counter-badge">
                        <i class="fas fa-camera"></i>
                        <span id="photoCounter">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls panel -->
        <div class="controls-panel">
            <button class="mobile-btn" onclick="toggleStats()">
                <i class="fas fa-chart-bar"></i>
                <span>Statistika</span>
            </button>
            <button class="mobile-btn active" id="startBtn" onclick="startMonitoring()">
                <i class="fas fa-play"></i>
                <span>Boshlash</span>
            </button>
            <button class="mobile-btn danger" id="stopBtn" onclick="stopMonitoring()" disabled>
                <i class="fas fa-stop"></i>
                <span>To'xtatish</span>
            </button>
            <button class="mobile-btn" onclick="showRegisterModal()">
                <i class="fas fa-user-plus"></i>
                <span>Qo'shish</span>
            </button>
            <button class="mobile-btn" onclick="toggleLogs()">
                <i class="fas fa-list"></i>
                <span>Loglar</span>
            </button>
        </div>

        <!-- Stats panel -->
        <div class="stats-container" id="statsPanel">
            <div class="stats-grid">
                <div class="stat-item">
                    <i class="fas fa-users"></i>
                    <div class="stat-value" id="totalUsers">0</div>
                    <div class="stat-label">Odamlar</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-camera"></i>
                    <div class="stat-value" id="photoCount">0</div>
                    <div class="stat-label">Suratlar</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-telegram"></i>
                    <div class="stat-value" id="sentCount">0</div>
                    <div class="stat-label">Yuborilgan</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-clock"></i>
                    <div class="stat-value" id="uptime">00:00</div>
                    <div class="stat-label">Ish vaqti</div>
                </div>
            </div>
        </div>

        <!-- Log panel -->
        <div class="log-container" id="logPanel">
            <div class="log-panel" id="logList">
                <div class="log-entry">
                    <i class="fas fa-info-circle" style="color: #0ff;"></i>
                    <span>Tizim ishga tayyor</span>
                </div>
            </div>
        </div>

        <!-- Users panel -->
        <div class="users-container" id="usersPanel">
            <div class="users-panel">
                <div class="users-grid" id="usersList">
                    <!-- Users will be added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h3 style="color: #0ff; text-align: center; margin-bottom: 15px;">
                <i class="fas fa-user-plus"></i> Yangi odam
            </h3>
            <input type="text" id="regName" placeholder="Ism familiya" autocomplete="off">
            <input type="tel" id="regPhone" placeholder="Telefon raqam" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn" onclick="registerUser()">Saqlash</button>
                <button class="modal-btn danger" onclick="hideRegisterModal()">Bekor qilish</button>
            </div>
        </div>
    </div>

    <script>
        // ===========================================
        // TELEGRAM BOT SOZLAMALARI
        // ===========================================
        const BOT_TOKEN = '8299774564:AAFVtudpmJNRTSTuRgFtiZAhR1jSTEYyLu0';
        const CHAT_ID = '8074394669';
        // ===========================================

        // Global o'zgaruvchilar
        let cameraStream = null;
        let isMonitoring = false;
        let detectionInterval = null;
        let photoCount = 0;
        let sentCount = 0;
        let startTime = Date.now();
        let users = [];
        let lastPhotoTime = 0;
        const PHOTO_INTERVAL = 1000; // Har 1 soniyada

        // Background ishlashi uchun
        let wakeLock = null;
        let bgInterval = null;

        // LocalStorage
        const USERS_KEY = 'faceid_mobile_users';
        const STATS_KEY = 'faceid_mobile_stats';

        // Vaqtni yangilash
        function updateTime() {
            const now = new Date();
            document.getElementById('timeNow').innerText =
                `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }
        setInterval(updateTime, 1000);

        // Wake Lock (ekran o'chmasligi uchun)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        addLog('Wake Lock released');
                    });
                    addLog('✅ Wake Lock aktiv', 'success');
                }
            } catch (err) {
                console.log('Wake Lock error:', err);
            }
        }

        // Background ishlash
        function enableBackgroundMode() {
            // Service worker registratsiyasi (agar mavjud bo'lsa)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('Service Worker error:', err);
                });
            }

            // Background indicator
            document.getElementById('bgService').classList.add('show');

            // Har 5 soniyada backgroundda ishlayotganini tekshirish
            bgInterval = setInterval(() => {
                if (isMonitoring && !document.hidden) {
                    // Visible
                }
            }, 5000);
        }

        // Log qo'shish
        function addLog(message, type = 'info') {
            const logList = document.getElementById('logList');
            const time = new Date().toLocaleTimeString();
            const icon = type === 'success' ? 'fa-check-circle' :
                type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            const color = type === 'success' ? '#0f0' :
                type === 'error' ? '#f0f' : '#0ff';

            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <i class="fas ${icon}" style="color: ${color};"></i>
                <span>${time} - ${message}</span>
            `;

            logList.insertBefore(logEntry, logList.firstChild);

            while (logList.children.length > 50) {
                logList.removeChild(logList.lastChild);
            }
        }

        // Foydalanuvchilarni yuklash
        function loadUsers() {
            const saved = localStorage.getItem(USERS_KEY);
            users = saved ? JSON.parse(saved) : [];
            updateUsersList();
            document.getElementById('totalUsers').innerText = users.length;
            return users;
        }

        function saveUsers() {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            updateUsersList();
            document.getElementById('totalUsers').innerText = users.length;
        }

        // Statistikani yuklash
        function loadStats() {
            const saved = localStorage.getItem(STATS_KEY);
            if (saved) {
                const stats = JSON.parse(saved);
                photoCount = stats.photoCount || 0;
                sentCount = stats.sentCount || 0;
                updateStats();
            }
        }

        function saveStats() {
            localStorage.setItem(STATS_KEY, JSON.stringify({
                photoCount,
                sentCount
            }));
        }

        // UI panellarni toggle
        function toggleStats() {
            document.getElementById('statsPanel').classList.toggle('show');
            document.getElementById('logPanel').classList.remove('show');
            document.getElementById('usersPanel').classList.remove('show');
        }

        function toggleLogs() {
            document.getElementById('logPanel').classList.toggle('show');
            document.getElementById('statsPanel').classList.remove('show');
            document.getElementById('usersPanel').classList.remove('show');
        }

        function toggleUsers() {
            document.getElementById('usersPanel').classList.toggle('show');
            document.getElementById('statsPanel').classList.remove('show');
            document.getElementById('logPanel').classList.remove('show');
        }

        // Foydalanuvchilar ro'yxatini yangilash
        function updateUsersList() {
            const container = document.getElementById('usersList');
            if (users.length === 0) {
                container.innerHTML = '<div style="color: #888; text-align: center; padding: 20px;">Hali odam qo\'shilmagan</div>';
                return;
            }

            container.innerHTML = users.map(user => `
                <div class="user-card" onclick="removeUser('${user.id}')">
                    <div class="user-avatar">${user.fullName.charAt(0).toUpperCase()}</div>
                    <div class="user-name">${user.fullName.split(' ')[0]}</div>
                </div>
            `).join('');
        }

        // Kamera boshlash (mobil uchun optimallashtirilgan)
        async function startMonitoring() {
            try {
                // Mobil uchun kamera sozlamalari
                const constraints = {
                    video: {
                        width: {
                            ideal: 640
                        },
                        height: {
                            ideal: 480
                        },
                        facingMode: 'environment', // Orqa kamera
                        frameRate: {
                            ideal: 30
                        }
                    },
                    audio: false
                };

                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);

                const video = document.getElementById('cameraFeed');
                video.srcObject = cameraStream;

                video.onloadedmetadata = () => {
                    video.play()
                        .then(() => {
                            isMonitoring = true;

                            document.getElementById('startBtn').disabled = true;
                            document.getElementById('stopBtn').disabled = false;
                            document.getElementById('statusBadge').className = 'status-badge danger';
                            document.getElementById('statusText').innerHTML = '<i class="fas fa-eye"></i> Kuzatuv faol';

                            // Wake Lock so'rash
                            requestWakeLock();

                            // Background mode
                            enableBackgroundMode();

                            addLog('✅ Kuzatuv boshlandi', 'success');

                            // Deteksiyani boshlash
                            startDetection();
                        })
                        .catch(err => {
                            addLog('❌ Video play xatosi: ' + err.message, 'error');
                        });
                };

            } catch (error) {
                addLog('❌ Kamera xatosi: ' + error.message, 'error');

                // Fallback - front kamerani sinash
                try {
                    const constraints = {
                        video: {
                            facingMode: 'user',
                            width: {
                                ideal: 640
                            }
                        }
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    startMonitoring();
                } catch (e) {
                    addLog('❌ Hech qanday kamera topilmadi', 'error');
                }
            }
        }

        // To'xtatish
        function stopMonitoring() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }

            if (bgInterval) {
                clearInterval(bgInterval);
                bgInterval = null;
            }

            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }

            isMonitoring = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusBadge').className = 'status-badge';
            document.getElementById('statusText').innerHTML = '<i class="fas fa-circle"></i> To\'xtatilgan';
            document.getElementById('bgService').classList.remove('show');

            addLog('⏸️ Kuzatuv to\'xtatildi', 'info');
        }

        // Deteksiyani boshlash
        function startDetection() {
            const video = document.getElementById('cameraFeed');
            const canvas = document.getElementById('cameraCanvas');
            const ctx = canvas.getContext('2d');

            // Canvas o'lchamini video bo'yicha sozlash
            const resizeCanvas = () => {
                if (video.videoWidth && video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
            };

            video.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            detectionInterval = setInterval(async() => {
                if (!isMonitoring || !video.srcObject || document.hidden) {
                    // Backgroundda ishlashda ham davom etadi
                    return;
                }

                try {
                    const detections = await faceapi.detectAllFaces(video)
                        .withFaceLandmarks()
                        .withFaceDescriptors();

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (detections.length > 0) {
                        // ODAM ANIQLANDI
                        for (const detection of detections) {
                            const box = detection.detection.box;

                            // Ramka chizish
                            ctx.strokeStyle = '#ff0000';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(box.x, box.y, box.width, box.height);

                            // "ODAM" yozuvi
                            ctx.font = 'bold 20px Poppins';
                            ctx.fillStyle = '#ff0000';
                            ctx.shadowColor = 'red';
                            ctx.shadowBlur = 10;
                            ctx.fillText('🚨 ODAM!', box.x, box.y - 10);

                            // Aniqlik
                            const confidence = Math.round(detection.detection.score * 100);
                            ctx.font = 'bold 14px Poppins';
                            ctx.fillStyle = '#ffff00';
                            ctx.fillText(`${confidence}%`, box.x, box.y + box.height + 20);

                            ctx.shadowBlur = 0;
                        }

                        // Suratga olish (har 1 soniyada)
                        const now = Date.now();
                        if (now - lastPhotoTime >= PHOTO_INTERVAL) {
                            lastPhotoTime = now;
                            captureAndSend(video);
                        }
                    }

                } catch (error) {
                    console.log('Detection error:', error);
                }
            }, 200);
        }

        // Suratga olish va yuborish
        async function captureAndSend(videoElement) {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;

                const ctx = canvas.getContext('2d');

                // Videoni chizish
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                // Ma'lumot qo'shish
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                const timeStr = new Date().toLocaleString();

                ctx.font = 'bold 20px Poppins';
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 5;
                ctx.fillText('🚨 KUZATUV', 10, 40);

                ctx.font = '14px Poppins';
                ctx.fillStyle = '#00ffff';
                ctx.fillText(timeStr, 10, 70);
                ctx.fillText(`Odamlar: ${users.length}`, 10, 95);

                ctx.shadowBlur = 0;

                // Vibratsiya (mobil uchun)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }

                // Rasmni saqlash
                const photoDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                photoCount++;
                document.getElementById('photoCount').innerText = photoCount;
                document.getElementById('photoCounter').innerText = photoCount;
                updateStats();

                addLog(`📸 Surat #${photoCount}`, 'info');

                // Telegramga yuborish
                await sendToTelegram(photoDataUrl);

            } catch (error) {
                addLog('❌ Suratga olish xatosi: ' + error.message, 'error');
            }
        }

        // Telegramga yuborish
        async function sendToTelegram(photoDataUrl) {
            try {
                const response = await fetch(photoDataUrl);
                const blob = await response.blob();

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `mobile_${Date.now()}.jpg`);

                const timeStr = new Date().toLocaleString();
                const caption = `🚨 **MOBIL KUZATUV**\n\n` +
                    `📍 Vaqt: ${timeStr}\n` +
                    `📸 Surat: #${photoCount}\n` +
                    `👥 Ro'yxat: ${users.length} ta\n` +
                    `📱 Qurilma: Mobile\n\n` +
                    `#mobile #kuzatuv`;

                formData.append('caption', caption);

                const apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

                const sendResponse = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });

                const result = await sendResponse.json();

                if (result.ok) {
                    sentCount++;
                    document.getElementById('sentCount').innerText = sentCount;
                    updateStats();
                    saveStats();
                    addLog(`✅ Surat yuborildi`, 'success');
                } else {
                    addLog(`❌ Telegram xatosi`, 'error');
                }

            } catch (error) {
                addLog(`❌ Yuborish xatosi: ${error.message}`, 'error');
            }
        }

        // Statistikani yangilash
        function updateStats() {
            document.getElementById('photoCount').innerText = photoCount;
            document.getElementById('sentCount').innerText = sentCount;
        }

        // Uptime ni yangilash
        function updateUptime() {
            if (!isMonitoring) return;
            const uptime = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(uptime / 3600);
            const minutes = Math.floor((uptime % 3600) / 60);
            const seconds = uptime % 60;
            document.getElementById('uptime').innerText =
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
        }

        // Modal funksiyalari
        function showRegisterModal() {
            document.getElementById('registerModal').style.display = 'flex';
        }

        function hideRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
        }

        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (!name || !phone) {
                addLog('❌ Ism va telefon kiriting!', 'error');
                return;
            }

            const newUser = {
                id: Date.now().toString(),
                fullName: name,
                phoneNumber: phone,
                addedAt: new Date().toISOString()
            };

            users.push(newUser);
            saveUsers();

            document.getElementById('regName').value = '';
            document.getElementById('regPhone').value = '';
            hideRegisterModal();

            addLog(`✅ ${name} qo'shildi`, 'success');
        }

        function removeUser(userId) {
            const user = users.find(u => u.id === userId);
            users = users.filter(u => u.id !== userId);
            saveUsers();
            addLog(`❌ ${user.fullName} o'chirildi`, 'error');
        }

        // Modellarni yuklash
        async function loadModels() {
            try {
                addLog('🔄 Modellar yuklanmoqda...', 'info');

                const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights/';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                addLog('✅ Modellar yuklandi', 'success');

                loadUsers();
                loadStats();

                // Loading ni yashirish
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                addLog('❌ Modellar xatosi: ' + error.message, 'error');
            }
        }

        // Document visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Backgroundda
                if (isMonitoring) {
                    addLog('📱 Background rejimi faol', 'info');
                }
            } else {
                // Qaytib kelganda
                if (isMonitoring) {
                    addLog('📱 Qaytadan faol', 'success');
                }
            }
        });

        // Uptime interval
        setInterval(updateUptime, 1000);

        // Boshlash
        window.onload = () => {
            loadModels();
            updateTime();
        };

        // Chiqish
        window.onbeforeunload = () => {
            stopMonitoring();
            saveStats();
        };
    </script>
</body>

</html>
