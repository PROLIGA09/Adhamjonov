<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceID Pro | 24/7 Avtomatik Kuzatuv</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(0, 0, 0, 0.95) 0%, rgba(20, 20, 40, 1) 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .app-wrapper {
            width: 100%;
            max-width: 1200px;
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            padding: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        /* Header */
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            margin-bottom: 5px;
        }
        /* Status Panel */
        
        .status-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .status-card i {
            font-size: 2em;
            color: #0ff;
            margin-bottom: 10px;
        }
        
        .status-label {
            color: #aaa;
            font-size: 0.9em;
        }
        
        .status-value {
            color: #0ff;
            font-size: 1.5em;
            font-weight: bold;
        }
        /* Kamera konteyneri */
        
        .camera-section {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }
        
        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #cameraCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* Deteksiya overlay */
        
        .detection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0ff, #f0f, transparent);
            animation: scanMove 2s linear infinite;
            box-shadow: 0 0 20px #0ff;
        }
        
        @keyframes scanMove {
            0% {
                top: -10px;
            }
            100% {
                top: 100%;
            }
        }
        
        .detection-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
        }
        /* Controls */
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.5);
            color: #0ff;
            border: 1px solid #0ff;
        }
        
        .btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        
        .btn.active {
            background: #0ff;
            color: #000;
        }
        
        .btn.danger {
            border-color: #f0f;
            color: #f0f;
        }
        
        .btn.danger:hover {
            background: #f0f;
            color: #000;
            box-shadow: 0 0 20px #f0f;
        }
        /* Log panel */
        
        .log-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            color: #0ff;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .log-entry i {
            width: 20px;
        }
        
        .log-time {
            color: #888;
            font-size: 0.8em;
        }
        /* Users panel */
        
        .users-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .user-card {
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
            cursor: pointer;
        }
        
        .user-card:hover {
            background: rgba(0, 255, 255, 0.2);
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #0ff, #f0f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            color: #000;
            font-weight: bold;
            font-size: 1.5em;
        }
        /* Modal */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: rgba(30, 30, 50, 0.95);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #0ff;
        }
        
        .modal input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0ff;
            border-radius: 10px;
            color: #0ff;
            font-size: 1em;
        }
        
        .modal-title {
            color: #0ff;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-video"></i> FACEID PRO - 24/7 KUZATUV</h1>
            <p style="color: #0ff; opacity: 0.8;">Xonada odam aniqlansa, avtomatik suratga olish tizimi</p>
        </div>

        <!-- Status Panel -->
        <div class="status-panel">
            <div class="status-card">
                <i class="fas fa-users"></i>
                <div class="status-label">Ro'yxatdan o'tgan</div>
                <div class="status-value" id="totalUsers">0</div>
            </div>
            <div class="status-card">
                <i class="fas fa-camera"></i>
                <div class="status-label">Suratlar soni</div>
                <div class="status-value" id="photoCount">0</div>
            </div>
            <div class="status-card">
                <i class="fas fa-telegram"></i>
                <div class="status-label">Yuborilgan</div>
                <div class="status-value" id="sentCount">0</div>
            </div>
            <div class="status-card">
                <i class="fas fa-clock"></i>
                <div class="status-label">Ish vaqti</div>
                <div class="status-value" id="uptime">00:00</div>
            </div>
        </div>

        <!-- Kamera sektsiyasi -->
        <div class="camera-section">
            <div class="camera-container">
                <video id="cameraFeed" autoplay playsinline></video>
                <canvas id="cameraCanvas"></canvas>
                <div class="detection-overlay">
                    <div class="scan-line"></div>
                    <div class="detection-frame"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn active" id="startBtn" onclick="startMonitoring()">
                    <i class="fas fa-play"></i> Boshlash
                </button>
                <button class="btn danger" id="stopBtn" onclick="stopMonitoring()" disabled>
                    <i class="fas fa-stop"></i> To'xtatish
                </button>
                <button class="btn" onclick="showRegisterModal()">
                    <i class="fas fa-user-plus"></i> Yangi odam
                </button>
                <button class="btn" onclick="clearStats()">
                    <i class="fas fa-trash"></i> Statistikani tozalash
                </button>
            </div>
        </div>

        <!-- Log panel -->
        <div class="log-panel" id="logPanel">
            <div class="log-entry">
                <i class="fas fa-info-circle" style="color: #0ff;"></i>
                <span class="log-time">00:00:00</span>
                <span>Tizim ishga tushdi. Kamera yoqish uchun "Boshlash" tugmasini bosing</span>
            </div>
        </div>

        <!-- Ro'yxatdan o'tgan odamlar -->
        <div class="users-panel">
            <h3 style="color: #0ff; margin-bottom: 10px;">
                <i class="fas fa-database"></i> Ro'yxatdan o'tgan odamlar: <span id="userCount">0</span>
            </h3>
            <div class="users-grid" id="usersList"></div>
        </div>
    </div>

    <!-- Registratsiya modali -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h2 class="modal-title"><i class="fas fa-user-plus"></i> Yangi odam qo'shish</h2>
            <input type="text" id="regName" placeholder="Ism familiya">
            <input type="text" id="regPhone" placeholder="Telefon raqam">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" style="flex: 1;" onclick="registerUser()">Saqlash</button>
                <button class="btn danger" style="flex: 1;" onclick="hideRegisterModal()">Bekor qilish</button>
            </div>
        </div>
    </div>

    <script>
        // ===========================================
        // TELEGRAM BOT SOZLAMALARI
        // ===========================================
        const BOT_TOKEN = '8299774564:AAFVtudpmJNRTSTuRgFtiZAhR1jSTEYyLu0'; // Bot tokenni o'zgartiring
        const CHAT_ID = '8074394669'; // Chat ID ni o'zgartiring
        // ===========================================

        // Global o'zgaruvchilar
        let cameraStream = null;
        let isMonitoring = false;
        let detectionInterval = null;
        let photoCount = 0;
        let sentCount = 0;
        let startTime = Date.now();
        let users = [];
        let lastPhotoTime = 0;
        const PHOTO_INTERVAL = 1000; // Har 1 soniyada 1 rasm

        // LocalStorage kalitlari
        const USERS_KEY = 'faceid_users_247';
        const STATS_KEY = 'faceid_stats_247';

        // Ma'lumotlarni yuklash
        function loadUsers() {
            const saved = localStorage.getItem(USERS_KEY);
            users = saved ? JSON.parse(saved) : [];
            return users;
        }

        function saveUsers() {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            updateUsersList();
            document.getElementById('totalUsers').innerText = users.length;
            document.getElementById('userCount').innerText = users.length;
        }

        function loadStats() {
            const saved = localStorage.getItem(STATS_KEY);
            if (saved) {
                const stats = JSON.parse(saved);
                photoCount = stats.photoCount || 0;
                sentCount = stats.sentCount || 0;
                updateStats();
            }
        }

        function saveStats() {
            localStorage.setItem(STATS_KEY, JSON.stringify({
                photoCount,
                sentCount
            }));
        }

        // Log yozish
        function addLog(message, type = 'info') {
            const logPanel = document.getElementById('logPanel');
            const time = new Date().toLocaleTimeString();
            const icon = type === 'success' ? 'fa-check-circle' :
                type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            const color = type === 'success' ? '#0f0' :
                type === 'error' ? '#f0f' : '#0ff';

            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <i class="fas ${icon}" style="color: ${color};"></i>
                <span class="log-time">${time}</span>
                <span>${message}</span>
            `;

            logPanel.insertBefore(logEntry, logPanel.firstChild);

            // 100 tadan ko'p logs bo'lsa o'chirish
            while (logPanel.children.length > 100) {
                logPanel.removeChild(logPanel.lastChild);
            }
        }

        // Uptime ni yangilash
        function updateUptime() {
            const uptime = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(uptime / 3600);
            const minutes = Math.floor((uptime % 3600) / 60);
            const seconds = uptime % 60;
            document.getElementById('uptime').innerText =
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Statistikani yangilash
        function updateStats() {
            document.getElementById('photoCount').innerText = photoCount;
            document.getElementById('sentCount').innerText = sentCount;
        }

        // Foydalanuvchilar ro'yxatini yangilash
        function updateUsersList() {
            const container = document.getElementById('usersList');
            if (users.length === 0) {
                container.innerHTML = '<div style="color: #888; text-align: center; padding: 20px;">Hali odam qo\'shilmagan</div>';
                return;
            }

            container.innerHTML = users.map(user => `
                <div class="user-card" onclick="removeUser('${user.id}')" title="O'chirish uchun bosing">
                    <div class="user-avatar">${user.fullName.charAt(0).toUpperCase()}</div>
                    <div style="font-size: 0.9em; color: #0ff;">${user.fullName.split(' ')[0]}</div>
                    <div style="font-size: 0.7em; color: #888;">${user.phoneNumber}</div>
                </div>
            `).join('');
        }

        // Kamerani boshlash
        async function startMonitoring() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        },
                        facingMode: 'environment' // Orqa kamera (xonani kuzatish uchun)
                    },
                    audio: false
                });

                const video = document.getElementById('cameraFeed');
                video.srcObject = cameraStream;

                video.onloadedmetadata = () => {
                    video.play();
                    isMonitoring = true;

                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;

                    addLog('✅ Kamera yoqildi. Kuzatuv boshlandi!', 'success');

                    // Deteksiyani boshlash
                    startDetection();
                };

            } catch (error) {
                addLog('❌ Kamera xatosi: ' + error.message, 'error');
            }
        }

        // To'xtatish
        function stopMonitoring() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }

            isMonitoring = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            addLog('⏸️ Kuzatuv to\'xtatildi', 'info');
        }

        // Deteksiyani boshlash
        function startDetection() {
            const video = document.getElementById('cameraFeed');
            const canvas = document.getElementById('cameraCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            detectionInterval = setInterval(async() => {
                if (!isMonitoring || !video.srcObject) return;

                try {
                    // Yuzni aniqlash
                    const detections = await faceapi.detectAllFaces(video)
                        .withFaceLandmarks()
                        .withFaceDescriptors();

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (detections.length > 0) {
                        // ODAM ANIQLANDI!

                        // Har bir aniqlangan yuz uchun
                        for (const detection of detections) {
                            const box = detection.detection.box;
                            const confidence = detection.detection.score * 100;

                            // Yuz atrofiga qizil ramka
                            ctx.strokeStyle = '#ff0000';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(box.x, box.y, box.width, box.height);

                            // "ODAM" deb yozish
                            ctx.font = 'bold 24px Poppins';
                            ctx.fillStyle = '#ff0000';
                            ctx.shadowColor = 'red';
                            ctx.shadowBlur = 10;
                            ctx.fillText('🚨 ODAM!', box.x, box.y - 20);
                            ctx.shadowBlur = 0;

                            // Aniqlik foizi
                            ctx.font = 'bold 16px Poppins';
                            ctx.fillStyle = '#ffff00';
                            ctx.fillText(`${Math.round(confidence)}%`, box.x, box.y + box.height + 25);
                        }

                        // SURATGA OLISH (har 1 soniyada)
                        const now = Date.now();
                        if (now - lastPhotoTime >= PHOTO_INTERVAL) {
                            lastPhotoTime = now;

                            // Rasmga olish
                            captureAndSend(video);
                        }

                    } else {
                        // Hech kim yo'q
                        ctx.font = 'bold 20px Poppins';
                        ctx.fillStyle = '#00ff00';
                        ctx.shadowColor = '#0f0';
                        ctx.shadowBlur = 10;
                        ctx.fillText('✅ Xona bo\'sh', 20, 50);
                        ctx.shadowBlur = 0;
                    }

                } catch (error) {
                    console.log('Deteksiya xatosi:', error);
                }
            }, 200); // 200ms tezlikda tekshirish
        }

        // Suratga olish va yuborish
        async function captureAndSend(videoElement) {
            // Suratga olish
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;

            const ctx = canvas.getContext('2d');

            // Videoni chizish (mirror effect)
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            // Ma'lumot qo'shish
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            const timeStr = new Date().toLocaleString();

            ctx.font = 'bold 24px Poppins';
            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 10;
            ctx.fillText('🚨 ODAM ANIQLANDI!', 20, 50);

            ctx.font = '18px Poppins';
            ctx.fillStyle = '#ffff00';
            ctx.fillText(`Vaqt: ${timeStr}`, 20, 90);

            // Ro'yxatdan o'tgan odamlar soni
            ctx.fillStyle = '#00ffff';
            ctx.fillText(`Ro'yxatda: ${users.length} ta odam`, 20, 120);

            ctx.shadowBlur = 0;

            // Rasmni base64 qilish
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.9);

            photoCount++;
            updateStats();

            addLog(`📸 Surat olindi #${photoCount}`, 'info');

            // Telegramga yuborish
            await sendToTelegram(photoDataUrl);
        }

        // Telegramga yuborish
        async function sendToTelegram(photoDataUrl) {
            try {
                // Base64 ni blob ga aylantirish
                const response = await fetch(photoDataUrl);
                const blob = await response.blob();

                // FormData yaratish
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `camera_${Date.now()}.jpg`);

                const timeStr = new Date().toLocaleString();
                const caption = `🚨 **ODAM ANIQLANDI!**\n\n` +
                    `📍 Vaqt: ${timeStr}\n` +
                    `📸 Surat raqami: #${photoCount}\n` +
                    `👥 Ro'yxatda: ${users.length} ta odam\n` +
                    `📊 Holat: ${users.length > 0 ? 'Ba\'zi odamlar tanish' : 'Notanish odam'}\n` +
                    `🔄 Har 1 soniyada yangi surat\n\n` +
                    `#kuzatuv #${new Date().toDateString().replace(/ /g, '_')}`;

                formData.append('caption', caption);

                // Telegram API ga yuborish
                const apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

                const sendResponse = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });

                const result = await sendResponse.json();

                if (result.ok) {
                    sentCount++;
                    updateStats();
                    saveStats();
                    addLog(`✅ Surat #${photoCount} Telegramga yuborildi`, 'success');
                } else {
                    addLog(`❌ Telegram xatosi: ${result.description}`, 'error');
                }

            } catch (error) {
                addLog(`❌ Yuborishda xatolik: ${error.message}`, 'error');
            }
        }

        // Yangi odam qo'shish
        function showRegisterModal() {
            document.getElementById('registerModal').style.display = 'flex';
        }

        function hideRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
        }

        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (!name || !phone) {
                addLog('❌ Iltimos, ism va telefon raqamni kiriting!', 'error');
                return;
            }

            const newUser = {
                id: Date.now().toString(),
                fullName: name,
                phoneNumber: phone,
                addedAt: new Date().toISOString()
            };

            users.push(newUser);
            saveUsers();

            document.getElementById('regName').value = '';
            document.getElementById('regPhone').value = '';
            hideRegisterModal();

            addLog(`✅ ${name} ro'yxatga qo'shildi`, 'success');
        }

        // Odamni o'chirish
        function removeUser(userId) {
            if (confirm('Bu odamni ro\'yxatdan o\'chirishni xohlaysizmi?')) {
                const user = users.find(u => u.id === userId);
                users = users.filter(u => u.id !== userId);
                saveUsers();
                addLog(`❌ ${user.fullName} ro'yxatdan o\'chirildi`, 'error');
            }
        }

        // Statistikani tozalash
        function clearStats() {
            if (confirm('Barcha statistikani tozalash?')) {
                photoCount = 0;
                sentCount = 0;
                saveStats();
                updateStats();
                addLog('📊 Statistika tozalandi', 'info');
            }
        }

        // Modellarni yuklash
        async function loadModels() {
            try {
                addLog('🔄 Yuz tanish modellari yuklanmoqda...', 'info');

                const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights/';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                addLog('✅ Modellar muvaffaqiyatli yuklandi', 'success');

                // Ma'lumotlarni yuklash
                loadUsers();
                loadStats();
                updateUsersList();
                document.getElementById('totalUsers').innerText = users.length;
                document.getElementById('userCount').innerText = users.length;

            } catch (error) {
                addLog('❌ Modellarni yuklashda xatolik: ' + error.message, 'error');
            }
        }

        // Uptime ni yangilash
        setInterval(updateUptime, 1000);

        // Sahifa yuklanganda
        window.onload = () => {
            loadModels();
        };

        // Sahifa yopilganda
        window.onbeforeunload = () => {
            stopMonitoring();
            saveStats();
        };
    </script>
</body>

</html>
